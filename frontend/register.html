<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Sehat Sathi</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/custom.css">

  <script>
  tailwind.config={
    darkMode:'class',
    theme:{
      extend:{
        colors:{
          primary:{
            50:'#ecfdf5',
            500:'#10b981',
            600:'#059669',
            700:'#047857'
          }
        },
        fontFamily:{
          sans:['Inter','sans-serif']
        }
      }
    }
  }
  </script>

</head>

<body class="font-sans bg-gradient-to-br from-primary-50 to-emerald-50 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-lg">

<div class="text-center mb-8">
<a href="/" class="inline-flex flex-col items-center gap-1">
<span class="text-5xl">🏥</span>
<span class="font-bold text-2xl text-primary-700 dark:text-primary-400">
Sehat Sathi
</span>
</a>
</div>

<div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 border border-gray-100 dark:border-gray-700">

<h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">
Create Free Account
</h1>

<p class="text-gray-400 text-sm mb-8">
Join for free AI-powered health guidance
</p>

<div id="errorMsg"
class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 text-red-700 dark:text-red-300 rounded-xl px-4 py-3 text-sm mb-4">
</div>

<div id="successMsg"
class="hidden bg-green-50 dark:bg-green-900/30 border border-green-200 text-green-700 dark:text-green-300 rounded-xl px-4 py-3 text-sm mb-4">
</div>

<div class="space-y-5">

<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
Full Name *
</label>

<input id="name"
type="text"
placeholder="e.g. Priya Sharma"
autocomplete="name"
class="w-full px-4 py-3 border border-gray-200 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">
</div>

<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
Email Address *
</label>

<input id="email"
type="email"
placeholder="you@example.com"
autocomplete="email"
class="w-full px-4 py-3 border border-gray-200 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">
</div>

<div>

<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
Mobile Number (optional)
</label>

<div class="flex gap-2">

<span class="px-3 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-gray-500 text-sm">
+91
</span>

<input id="phone"
type="tel"
placeholder="9876543210"
maxlength="10"
class="flex-1 px-4 py-3 border border-gray-200 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">

</div>

</div>

<div>

<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
Preferred Language *
</label>

<select id="language"
class="w-full px-4 py-3 border border-gray-200 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">

<option value="en">🇬🇧 English</option>
<option value="hi">🇮🇳 हिन्दी (Hindi)</option>
<option value="mr">🇮🇳 मराठी (Marathi)</option>
<option value="ta">🇮🇳 தமிழ் (Tamil)</option>
<option value="bn">🇧🇩 বাংলা (Bengali)</option>

</select>

</div>

<div>

<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
Password *
<span class="text-xs text-gray-400">(min 8 chars, upper+lower+digit)</span>
</label>

<div class="relative">

<input id="password"
type="password"
placeholder="Create a strong password"
class="w-full px-4 py-3 border border-gray-200 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none pr-12">

<button type="button"
id="togglePassword"
class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-lg">
👁
</button>

</div>

<div class="mt-2 h-1.5 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden">
<div id="pwdStrength"
class="h-full rounded-full transition-all duration-300 w-0 bg-red-400">
</div>
</div>

<p id="pwdStrengthText"
class="text-xs text-gray-400 mt-1">
</p>

</div>

<div class="flex items-start gap-3">

<input id="terms"
type="checkbox"
class="mt-1 rounded text-primary-600 focus:ring-primary-500">

<label for="terms"
class="text-sm text-gray-600 dark:text-gray-400">

I agree to the
<a href="#" class="text-primary-600 hover:underline">Terms of Use</a>
and understand this platform provides health information, not medical diagnosis.

</label>

</div>

<button id="regBtn"
class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl flex items-center justify-center gap-2">

<span id="regBtnText">Create Account</span>

<span id="regSpinner"
class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin">
</span>

</button>

</div>

<p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
Already have an account?
<a href="/login.html"
class="text-primary-600 dark:text-primary-400 font-semibold hover:underline">
Sign in
</a>
</p>

</div>

<div class="text-center mt-4">
<a href="/" class="text-xs text-primary-500 hover:underline">
← Back to Home
</a>
</div>

</div>

<script src="/js/lang/en.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
