<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Sehat Sathi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/custom.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: { 50:'#ecfdf5', 500:'#10b981', 600:'#059669', 700:'#047857' } },
          fontFamily: { sans: ['Inter','sans-serif'] }
        }
      }
    }
  </script>
</head>

<body class="font-sans bg-gradient-to-br from-primary-50 to-emerald-50 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">

  <!-- Logo -->
  <div class="text-center mb-8">
    <a href="/" class="inline-flex flex-col items-center gap-1">
      <span class="text-5xl">🏥</span>
      <span class="font-bold text-2xl text-primary-700 dark:text-primary-400">Sehat Sathi</span>
      <span class="text-gray-400 text-sm">Health Companion</span>
    </a>
  </div>

  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 border border-gray-100 dark:border-gray-700">

    <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Welcome Back</h1>
    <p class="text-gray-400 text-sm mb-8">Sign in to access your health dashboard</p>

    <div id="errorMsg" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-700 text-red-700 dark:text-red-300 rounded-xl px-4 py-3 text-sm mb-4"></div>
    <div id="successMsg" class="hidden bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-700 text-green-700 dark:text-green-300 rounded-xl px-4 py-3 text-sm mb-4"></div>

    <div class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email Address</label>
        <input id="email" type="email" placeholder="you@example.com"
          class="w-full px-4 py-3 border border-gray-200 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
        <div class="relative">
          <input id="password" type="password" placeholder="••••••••"
            class="w-full px-4 py-3 border border-gray-200 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none pr-12">
          <button type="button" id="togglePassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-lg">
            👁
          </button>
        </div>
      </div>

      <button id="loginBtn"
        class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl flex items-center justify-center gap-2">
        <span id="loginBtnText">Sign In</span>
        <span id="loginSpinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      </button>

    </div>

    <div class="mt-6 text-center text-sm">
      <span class="text-gray-500 dark:text-gray-400">Don't have an account?</span>
      <a href="/register.html" class="ml-1 text-primary-600 dark:text-primary-400 font-semibold hover:underline">Create one free</a>
    </div>

  </div>

</div>

<script src="/js/lang/en.js" defer></script>
<script src="/js/auth.js" defer></script>
</body>
</html>
